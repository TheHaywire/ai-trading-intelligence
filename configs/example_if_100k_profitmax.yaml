account:
  program: instant_funding
  starting_balance: 100000.0
  currency: USD
  leverage:
    fx: 100
    indices: 20
    commodities: 20
    crypto: 2
  inactivity_days_close: 60

drawdown:
  model: smart
  smart:
    initial_pct: 0.10
    lock_after_gain_pct: 0.05
    locked_pct: 0.05
  static:
    max_loss_pct: 0.06

daily_drawdown:
  pct: 0.00  # 0 for IF funded accounts
  compute_on: equity
  halt_buffer_pct: 0.80

risk:
  max_risk_per_idea_pct: 2.9
  max_positions_per_symbol: 3
  min_hold_seconds: 61
  max_trades_per_hour: 25
  forbid_grid: true
  forbid_public_ea: true
  allow_martingale_challenge: true
  allow_martingale_if_account: limited

  # 🚀 PROFIT-MAX: Dynamic Risk Tuning
  target_portfolio_vol_annual_pct: 18
  kelly_fraction_cap: 0.33
  kelly_min_pct: 0.3
  kelly_max_pct: 2.9
  protected_aggression: true
  aggression_bands:
    lo:   { cum_dd_util_lt: 0.2, daily_dd_util_lt: 0.2, mult: 1.25 }
    mid:  { cum_dd_util_lt: 0.5, daily_dd_util_lt: 0.5, mult: 1.00 }
    hi:   { cum_dd_util_lt: 0.8, daily_dd_util_lt: 0.8, mult: 0.60 }

# 🚀 PROFIT-MAX: Execution Alpha
execution:
  spread_threshold_points: 8
  spread_cap_points: 20
  max_slippage_points: 6
  twap_slices: 3
  twap_min_separation_sec: 70
  adaptive_slippage: true

# 🚀 PROFIT-MAX: Portfolio Allocation (HRP)
portfolio:
  hrp_enabled: true
  max_corr_abs: 0.8
  per_currency_risk_cap_pct: 6
  lookback_days: 90
  fallback_days: 30

# 🚀 PROFIT-MAX: Regime Detection & Routing
regime:
  enabled: true
  features_window_days: 90
  vol_threshold_low: 0.10
  vol_threshold_high: 0.25
  trend_threshold: 25.0
  router:
    Trend:
      enable: ["trend_breakout", "ema_trend"]
      risk_mult: 1.0
      widen_stops: 1.0
    Choppy:
      enable: ["mean_reversion_bands"]
      risk_mult: 0.9
      widen_stops: 1.0
    HighVol:
      enable: ["trend_breakout"]
      risk_mult: 0.8
      widen_stops: 1.2
    LowVol:
      enable: ["mean_reversion_bands"]
      risk_mult: 0.95
      widen_stops: 1.0

# 🚀 PROFIT-MAX: Session Playbooks
sessions:
  asia:
    enable: ["mean_reversion_bands"]
    spread_cap_points: 18
    risk_mult: 0.9
    thin_crosses_blocked: true
  london:
    enable: ["trend_breakout", "breakout_session_open", "ema_trend"]
    spread_cap_points: 14
    risk_mult: 1.0
  ny:
    enable: ["trend_breakout", "ema_trend"]
    spread_cap_points: 16
    risk_mult: 1.0
  overlap_london_ny:
    enable: ["trend_breakout", "breakout_session_open", "ema_trend", "mean_reversion_bands"]
    spread_cap_points: 12
    risk_mult: 1.05

news:
  enforce_window: true
  window_seconds: 240
  source_list: [fxfactory, fxstreet]
  apply_only_to_impacted_symbols: true
  add_on_enabled: false
  weekend_holding_enabled: false

lot_caps:
  config_file: configs/lot_caps.yaml

payouts:
  mode: scheduled
  first_wait_days: 14
  subsequent_wait_days: 7
  min_amount_usd: 25
  min_profit_pct_of_start: 1.5
  best_day_cap_pct: 40
  # 🚀 PROFIT-MAX: Payout-Aware De-risking
  derisk_days_before: 3
  derisk_risk_mult_cap: 0.7

scaling:
  smart_dd:
    trigger_gain_pct: 10
    new_locked_pct: 5
  static_dd:
    gain_pct: 10
    interval_days: 90
    scale_increment_pct: 25

account_caps:
  max_starting_balances_total: 640000
  max_challenge_total: 400000
  max_instant_total: 240000
  max_instant_micro_total: 200000

# 🚀 PROFIT-MAX: Health Monitoring
health_monitor:
  enabled: true
  breach_prob_threshold: 0.15
  alpha_drift_threshold_pct: 40.0
  slippage_alert_threshold: 2.0
  expectancy_tracking: true

# 🚀 PROFIT-MAX: Strategy Configurations
strategies:
  trend_breakout:
    enabled: true
    ema_fast: 50
    ema_slow: 200
    atr_period: 14
    atr_min_multiplier: 1.0
    sl_atr_multiplier: 2.0
    tp_ratios: [1.0, 2.0, 3.0]

  ema_trend:
    enabled: true
    ema_trend_period: 50
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    pullback_tolerance: 0.5
    # 🎯 OPTIMIZED PARAMETERS (324-combo grid search + walk-forward validated)
    # Win Rate: 53.4% | Profit Factor: 1.50 | Expectancy: +$143
    atr_period: 14
    atr_multiplier: 3.0  # ← KEY: 3× ATR stops (optimized from 2.0)
    volume_period: 20
    volume_threshold: 1.5
    adx_period: 14

  mean_reversion_bands:
    enabled: false  # ❌ DISABLED - Failed backtest (40.2% WR, 0.68 PF, -$302 expectancy)
    vwap_period: 20
    atr_period: 14
    band_multiplier: 2.0
    rsi_period: 2
    rsi_oversold: 5
    rsi_overbought: 95
    max_spread_points: 8
    allowed_symbols: ["EURUSD", "GBPUSD", "USDJPY", "AUDUSD", "XAUUSD"]
    allowed_sessions: ["asia", "london"]

  breakout_session_open:
    enabled: false  # Temporarily disabled - has datetime type issue
    session_box_minutes: 30
    ema_trend_period: 50
    atr_period: 14
    atr_trail_mult: 2.0
    retest_tolerance_pct: 0.2
    max_spread_points: 14
    sessions: ["london", "ny"]
    allowed_symbols: ["EURUSD", "GBPUSD", "US30", "US500", "NAS100"]

platform:
  broker: MT5
  server: "XMGlobal-MT5 2"
  login: "165835373"
  password: "Manan@123!!"
  symbol_map_file: "src/core/symbols.py"

ops:
  timezone_display: "Asia/Kolkata"
  logs_dir: "runs/logs"
  reports_dir: "runs/reports"
  screenshot_dashboard: true
  news_calendar_path: "configs/news_events_seed.json"
